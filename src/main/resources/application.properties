spring.application.name=minidog

# Persistence is enabled in the next implementation slice. Keeping these
# auto-configurations off lets the ingestion pipeline run without DB secrets.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration

minidog.pipeline.queue-capacity=10000
minidog.pipeline.worker-count=8
