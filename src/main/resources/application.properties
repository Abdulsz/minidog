spring.application.name=minidog

# Local development uses a durable embedded database. A PostgreSQL/Supabase
# connection can be selected without code changes by setting these variables.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/minidog;MODE=PostgreSQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=MiniDog
info.app.description=Concurrent metrics ingestion and aggregation service

minidog.pipeline.queue-capacity=10000
minidog.pipeline.worker-count=8
minidog.pipeline.cardinality-limit=1000
minidog.pipeline.flush-interval-seconds=10
