spring.datasource.url=jdbc:h2:mem:minidog-tests;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
minidog.pipeline.queue-capacity=10000
minidog.pipeline.worker-count=2
minidog.pipeline.cardinality-limit=1000
minidog.pipeline.flush-interval-seconds=3600
